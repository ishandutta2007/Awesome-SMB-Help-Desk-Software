<svg fill="none" viewBox="0 0 1200 360" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .stat-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #94a3b8;
    }
    .stat-val {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f8fafc;
    }

    /* Animations for background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-shape {
      animation: floatParticle 8s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-dash {
      stroke-dasharray: 8 8;
      animation: dashLine 3s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Placed strictly BEHIND text and cards) -->
  <!-- Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" class="pulsing-orb" />
  <circle cx="1050" cy="280" r="160" fill="url(#glowGrad)" class="pulsing-orb" style="animation-delay: -3s;" />

  <!-- Geometric Grid & Connecting Dash Lines in Background -->
  <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M300 0 V360 M600 0 V360 M900 0 V360" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  
  <path d="M 100 280 Q 250 320 400 280 T 700 290 T 1100 270" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="2" class="animated-dash"/>

  <!-- Floating Ambient Shapes in Background -->
  <rect x="980" y="50" width="30" height="30" rx="6" fill="#818cf8" fill-opacity="0.12" class="floating-shape"/>
  <circle cx="120" cy="290" r="16" fill="#38bdf8" fill-opacity="0.1" class="floating-shape" style="animation-delay: -2s;"/>
  <polygon points="1080,180 1100,210 1060,210" fill="#c084fc" fill-opacity="0.15" class="floating-shape" style="animation-delay: -4s;"/>

  <!-- BACKGROUND GRAPHIC CARDS (Lower Right / Right - non-overlapping with main text on left) -->
  <g filter="url(#dropShadow)" transform="translate(780, 50)">
    <!-- Right Tech Card 1 -->
    <rect width="360" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Card Header -->
    <circle cx="30" cy="30" r="14" fill="#6366f1" fill-opacity="0.2"/>
    <path d="M24 30 L28 34 L36 26" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="34" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Ticketing &amp; Omnichannel</text>
    <rect x="270" y="20" width="70" height="20" rx="10" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="305" y="34" text-anchor="middle" class="badge-text" font-size="11">SaaS &amp; OSS</text>
    
    <!-- Dynamic Progress Bars in Card -->
    <text x="30" y="68" class="stat-label">SaaS Market Size</text>
    <text x="130" y="68" class="stat-val">$11.8B</text>
    <rect x="30" y="78" width="300" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="30" y="78" width="230" height="6" rx="3" fill="url(#titleGrad)"/>
  </g>

  <g filter="url(#dropShadow)" transform="translate(780, 185)">
    <!-- Right Tech Card 2 -->
    <rect width="360" height="125" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="30" cy="32" r="14" fill="#a855f7" fill-opacity="0.2"/>
    <path d="M25 27 H35 M25 32 H35 M25 37 H31" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="36" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Shared Inbox &amp; Knowledge Base</text>
    
    <!-- Mini Stats Grid inside Card -->
    <line x1="30" y1="55" x2="330" y2="55" stroke="#ffffff" stroke-opacity="0.1"/>
    
    <text x="30" y="78" class="stat-label">Top Open Source</text>
    <text x="30" y="98" class="stat-val">Chatwoot (37.6k ★)</text>

    <text x="190" y="78" class="stat-label">Market Structure</text>
    <text x="190" y="98" class="stat-val">Moderately Fragmented</text>
  </g>

  <!-- FOREGROUND CONTENT (Left Aligned - Clean, High Contrast & Completely Unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="125" y="20" text-anchor="middle" class="badge-text">🎧 CURATED SMB HELP DESK LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Awesome SMB Help Desk</text>
    <text x="0" y="180" class="title">Software 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle">Top Commercial SaaS Platforms &amp; Open-Source Support Ticket Ecosystems</text>

    <!-- Key Feature Badges Row -->
    <g transform="translate(0, 255)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">📥 Shared Inboxes</text>

      <!-- Badge 2 -->
      <rect x="157" y="0" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="173" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">🎫 Ticket Systems</text>

      <!-- Badge 3 -->
      <rect x="334" y="0" width="160" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="350" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">📚 Knowledge Base</text>

      <!-- Badge 4 -->
      <rect x="506" y="0" width="135" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="522" y="21" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">⚡ Self-Hosted</text>
    </g>
  </g>
</svg>
